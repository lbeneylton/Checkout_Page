[project]
name = "checkout-page"
version = "0.1.0"
description = "Checkout platform with FastAPI and Asaas"
authors = [
    {name = "Lucas Beneylton",email = "47756391+lbeneylton@users.noreply.github.com"}
]

requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "authlib (>=1.7.2,<2.0.0)",
]

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
black = "^25.1.0"
ruff = "^0.12.0"
isort = "^6.0.0"

[tool.black]
line-length = 88

[tool.ruff]
src = ["src"]
line-length = 88

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"